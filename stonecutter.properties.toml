[mod]
id = "eg_invisible_frames"
name = "Invisible Frames"
description = "Lets you turn Item Frames invisible by right-clicking them with a glass pane!. Fully server-side and can be customised with a datapack, read more on the mod website"
group = "games.enchanted"
version = "2.2.1"
license = "CC BY-NC 4.0"
source_url = "https://github.com/Enchanted-Games/invisible-frames"
issue_tracker = "https://github.com/Enchanted-Games/invisible-frames/issues"
icon = "assets/eg_invisible_frames/icon.png"

# neoforge versions: https://projects.neoforged.net/neoforged/neoforge
# fabric versions: https://fabricmc.net/develop/

[fabric]
deps.fabric-loader = "0.19.2"
dep_str.fabric-loader = ">=0.19"

["26.1"]
deps.minecraft = "26.1.2"

[fabric."26.1"]
dep_str.minecraft = ">=26.1 <26.2"

deps.fabric-api = "0.152.1+26.1.2"
dep_str.fabric-api = ">=0.146.1+26.1.2"

deps.modmenu = "18.0.0-beta.1"

[neoforge."26.1"]
dep_str.minecraft = "[26.1,26.2)"

deps.neoforge = "26.1.2.76"


["26.2"]
deps.minecraft = "26.2"

[fabric."26.2"]
dep_str.minecraft = ">=26.2 <26.3"

deps.fabric-api = "0.152.1+26.2"
dep_str.fabric-api = ">=0.152.1+26.2"

deps.modmenu = "20.0.0-beta.2"

[neoforge."26.2"]
dep_str.minecraft = "[26.2,26.3)"

deps.neoforge = "26.2.0.0-beta"